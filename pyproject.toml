[project]
name = "moove"
version = "1.0.3"
description = "A tool for real-time syllable segmentation and classification of birdsong, designed to enable closed-loop experiments in vocal learning research."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nils Riekers"},
    {name = "Franziska Heubach"},
    {name = "Jacqueline Laura Goebl"},
    {name = "Lena Veit"}
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "matplotlib>=3.9.0",
    "torch>=2.0.0",
    "evfuncs>=0.3.5.post1",
    "numpy>=1.20",
    "sounddevice>=0.5.0",
    "rangeslider>=2023.7.2",
    "pyaudio>=0.2.14",
    "jinja2>=3.1.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.1",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.6",
    "dash>=2.17.1",
    "ttkbootstrap>=1.10.1",
    "ttkwidgets>=0.13.0",
    "pillow>=10.0.0",
]

[project.scripts]
moovegui = "moove.moovegui:main"
moovetaf = "moove.moovetaf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moove"]
