{% set python_min = "3.10" %}
{% set version = "1.20.2" %}

package:
  name: ttkbootstrap
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/t/ttkbootstrap/ttkbootstrap-{{ version }}.tar.gz
  sha256: e8408ff4cffd7eb2767d7b33c3882d59c1bdf37cfeba29d9a3d45f486d370c7a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=61
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - pillow >=10,<13

test:
  imports:
    - ttkbootstrap
    - ttkcreator
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/israel-dryer/ttkbootstrap
  summary: A supercharged theme extension for tkinter that enables on-demand modern flat style themes inspired by Bootstrap.
  doc_url: https://ttkbootstrap.readthedocs.io/en/latest/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AddYourGitHubIdHere
