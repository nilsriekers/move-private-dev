{% set name = "moove" %}
{% set version = "1.0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # For local testing: build from the repo root
  path: ..
  # For conda-forge submission, replace with:
  # url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  # sha256: <sha256-of-sdist>

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - moovegui = moove.moovegui:main
    - moovetaf = moove.moovetaf:main

requirements:
  host:
    - python >=3.9,<3.13
    - pip
    - hatchling
  run:
    - python >=3.9,<3.13
    # --- available on conda-forge ---
    - matplotlib >=3.9.0
    - pytorch >=2.0.0
    - numpy >=1.20
    - sounddevice >=0.5.0
    - portaudio
    - pyaudio >=0.2.14
    - jinja2 >=3.1.4
    - pandas >=2.2.2
    - scikit-learn >=1.5.1
    - seaborn >=0.13.2
    - umap-learn >=0.5.6
    - dash >=2.17.1
    - pillow >=10.0.0
    # --- need conda-forge feedstocks first (recipes in conda.recipe/deps/) ---
    - evfuncs >=0.3.5.post1
    - rangeslider >=2023.7.2
    - ttkbootstrap >=1.10.1
    - ttkwidgets >=0.13.0

test:
  imports:
    - moove
    - moove.models.ConvMLP
    - moove.models.CNN
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/nilsriekers/moove
  summary: Real-time syllable segmentation and classification of birdsong for closed-loop experiments.
  license: MIT
  license_file: LICENSE
